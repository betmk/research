<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Research{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<style>
  :root {
    --bg-0: #0b1019;
    --bg-1: #111827;
    --bg-2: #1a2234;
    --bg-3: #243049;
    --border-1: #2a3549;
    --border-2: #374a6a;
    --text-0: #f8fafc;
    --text-1: #e4e9f2;
    --text-2: #a5b0c2;
    --text-3: #6b7689;
    --accent: #60a5fa;
    --signal-up: #22c55e;
    --signal-up-bg: rgba(34,197,94,0.12);
    --signal-down: #ef4444;
    --signal-down-bg: rgba(239,68,68,0.12);
    --signal-warn: #f59e0b;
    --signal-warn-bg: rgba(245,158,11,0.11);
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    --r-sm: 4px;
    --r-md: 8px;
    --r-lg: 12px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-0);
    color: var(--text-1);
    font-family: var(--font-sans);
    font-feature-settings: "tnum" 1, "ss01" 1;
    line-height: 1.5;
  }
  .container { max-width: 1600px; margin: 0 auto; padding: 1.5rem; }
  header {
    border-bottom: 1px solid var(--border-1);
    padding-bottom: 1rem; margin-bottom: 1.5rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  h1 {
    font-size: 1.4rem; font-weight: 700; margin: 0;
    font-family: var(--font-mono); letter-spacing: -0.02em;
  }
  h2 {
    font-size: 0.95rem; font-weight: 700;
    font-family: var(--font-mono); letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--text-2);
    margin: 0 0 0.5rem 0;
  }
  .grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 1.25rem;
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--bg-1);
    border: 1px solid var(--border-1);
    border-radius: var(--r-lg);
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }
  .panel-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 0.75rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border-1);
  }
  .panel-header .age {
    font-family: var(--font-mono); font-size: 0.7rem;
    color: var(--text-3); letter-spacing: 0.05em;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border-1);
    font-size: 0.88rem;
  }
  .row:last-child { border-bottom: none; }
  .row-key { color: var(--text-2); }
  .row-val {
    font-family: var(--font-mono); font-weight: 600; color: var(--text-0);
  }
  .up { color: var(--signal-up); }
  .down { color: var(--signal-down); }
  .warn { color: var(--signal-warn); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .news-item {
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border-1);
    font-size: 0.85rem;
  }
  .news-item:last-child { border-bottom: none; }
  .news-item .source {
    display: inline-block;
    font-family: var(--font-mono); font-size: 0.66rem;
    background: var(--bg-3); padding: 1px 6px; border-radius: 3px;
    color: var(--text-2); letter-spacing: 0.05em; text-transform: uppercase;
    margin-right: 0.4rem;
  }
  .news-item .time {
    font-family: var(--font-mono); font-size: 0.7rem;
    color: var(--text-3); margin-left: 0.4rem;
  }
  .empty { color: var(--text-3); font-size: 0.85rem; padding: 0.5rem 0; }
  .actions { display: flex; gap: 0.5rem; }
  button {
    background: var(--bg-2); border: 1px solid var(--border-2);
    color: var(--text-1); padding: 0.3rem 0.7rem;
    font-family: var(--font-mono); font-size: 0.72rem;
    letter-spacing: 0.05em; text-transform: uppercase;
    border-radius: var(--r-sm); cursor: pointer;
  }
  button:hover { background: var(--bg-3); }
  .status-ok { color: var(--signal-up); }
  .status-fail { color: var(--signal-down); }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th, td {
    text-align: left; padding: 0.35rem 0.5rem;
    border-bottom: 1px solid var(--border-1);
  }
  th {
    font-family: var(--font-mono); font-size: 0.7rem;
    text-transform: uppercase; color: var(--text-3);
    font-weight: 600; letter-spacing: 0.05em;
  }
  td { font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>RESEARCH &mdash; LIVE DESK</h1>
    <div class="age">{{ now.strftime("%Y-%m-%d %H:%M UTC") }}</div>
  </header>
  {% block content %}{% endblock %}
</div>
</body>
</html>
